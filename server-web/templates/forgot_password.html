<!DOCTYPE html>
<html lang="ko-KR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>산업 안전 모니터링 시스템 - 비밀번호 찾기</title>

    <link href="{{ url_for('static', path='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='css/sb-admin-2.min.css') }}" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 어두운 남색 그라데이션 배경 */
        body.bg-monitoring {
            background: linear-gradient(180deg, #2c3e50 10%, #1a252f 100%);
            background-size: cover;
            min-height: 100vh;
        }

        /* 중앙 정렬된 프리미엄 화이트 카드 */
        .auth-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            margin: auto;
            border: none;
        }

        /* 큼직하고 둥근 입력창 (요청하신 대로 칸을 크게 키움) */
        .form-control-custom {
            border-radius: 50rem;
            padding: 1.6rem 1.8rem; /* 세로 패딩 대폭 증가 */
            font-size: 1.05rem; /* 글자 크기 확대 */
            background-color: #f8f9fc;
            border: 1px solid #eaecf4;
            color: #4e5e6a;
            transition: all 0.2s ease-in-out;
            height: auto;
        }
        .form-control-custom:focus {
            background-color: #fff;
            border-color: #bac8f3;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
            outline: none;
        }

        /* 프리미엄 둥근 버튼 */
        .btn-custom {
            border-radius: 50rem;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(78, 115, 223, 0.2);
        }

        /* 아이콘 포인트 */
        .auth-icon {
            font-size: 3.5rem;
            color: #4e73df;
            margin-bottom: 1.2rem;
        }
    </style>
</head>

<body class="bg-monitoring d-flex align-items-center justify-content-center">
    
    <div class="container p-3">
        <div class="auth-card p-sm-5 p-4">
            
            <header class="text-center mb-5">
                <i class="fas fa-shield-alt auth-icon"></i>
                <h1 class="h4 text-gray-900 font-weight-bold mb-2">계정 찾기</h1>
                <p class="small text-muted mb-0">비밀번호를 재설정할 계정(이메일)을 입력해주세요.</p>
            </header>

            {% if error %}
            <div class="alert alert-danger text-center small border-0 shadow-sm rounded-pill mb-4" style="background-color: #ffeaea; color: #e74a3b;">
                <i class="fas fa-exclamation-circle mr-1"></i> {{ error }}
            </div>
            {% endif %}
            
            <section>
                <!-- [비밀번호 찾기 폼] POST /forgot_password — 이메일 존재 확인 후 재설정 페이지로 이동 -->
<form class="user" method="POST">
                    <!-- [이메일 입력] 가입된 이메일 입력 → 존재하면 /reset_password/{email} 로 이동 -->
<div class="form-group mb-4">
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="가입한 이메일 주소 입력" required>
                    </div>
                    <!-- [계정 확인 버튼] 입력된 이메일 DB 조회 → 없으면 오류, 있으면 재설정 페이지 이동 -->
<button type="submit" class="btn btn-primary btn-custom btn-block mt-4">
                        계정 확인하기
                    </button>
                </form>
            </section>

            <hr class="my-4 border-light mt-5">

            <!-- [하단 링크] 로그인 화면으로 돌아가기 -->
<footer class="text-center">
                <a class="small font-weight-bold text-gray-600 hover-primary" href="{{ url_for('login') }}" style="text-decoration: none;">
                    <i class="fas fa-arrow-left fa-sm mr-1"></i> 로그인 화면으로 돌아가기
                </a>
            </footer>

        </div>
    </div>

    <script src="{{ url_for('static', path='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
