<!DOCTYPE html>
<html lang="ko-KR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>산업 안전 모니터링 시스템 - 새 비밀번호 설정</title>

    <link href="{{ url_for('static', path='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='css/sb-admin-2.min.css') }}" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 어두운 남색 그라데이션 배경 통일 */
        body.bg-monitoring {
            background: linear-gradient(180deg, #2c3e50 10%, #1a252f 100%);
            background-size: cover;
            min-height: 100vh;
        }

        /* 중앙 정렬 프리미엄 화이트 카드 */
        .auth-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            margin: auto;
            border: none;
        }

        /* 큼직하고 둥근 입력창 (요청사항 반영) */
        .form-control-custom {
            border-radius: 50rem;
            padding: 1.6rem 1.8rem; /* 세로 패딩 대폭 증가 */
            font-size: 1.05rem; /* 글자 크기 확대 */
            background-color: #f8f9fc;
            border: 1px solid #eaecf4;
            color: #4e5e6a;
            transition: all 0.2s ease-in-out;
            height: auto;
        }
        .form-control-custom:focus {
            background-color: #fff;
            border-color: #1cc88a; /* 성공을 의미하는 녹색 포커스 */
            box-shadow: 0 0 0 0.2rem rgba(28, 200, 138, 0.25);
            outline: none;
        }

        /* 프리미엄 둥근 버튼 (사진처럼 녹색 계열 사용) */
        .btn-custom {
            border-radius: 50rem;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.2s;
            background-color: #1cc88a;
            border-color: #1cc88a;
            color: white;
        }
        .btn-custom:hover {
            background-color: #17a673;
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(28, 200, 138, 0.2);
            color: white;
        }

        .auth-icon {
            font-size: 3.5rem;
            color: #1cc88a;
            margin-bottom: 1.2rem;
        }

        /* 이메일 강조 박스 */
        .email-badge {
            background-color: #f1f3f6;
            padding: 0.5rem 1rem;
            border-radius: 50rem;
            display: inline-block;
            font-weight: 700;
            color: #5a5c69;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body class="bg-monitoring d-flex align-items-center justify-content-center">
    
    <div class="container p-3">
        <div class="auth-card p-sm-5 p-4">
            
            <header class="text-center mb-5">
                <i class="fas fa-lock auth-icon"></i>
                <h1 class="h4 text-gray-900 font-weight-bold mb-3">새 비밀번호 설정</h1>
                <div class="email-badge">{{ email }}</div>
                <p class="small text-muted mb-0 mt-2">해당 계정의 새로운 비밀번호를 입력해주세요.</p>
            </header>

            <section>
                <!-- [비밀번호 재설정 폼] POST /reset_password/{email} — 새 비밀번호 저장 후 /login 이동 -->
<form class="user" method="POST">
                    <div class="form-group mb-3 position-relative">
                        <!-- [새 비밀번호 입력] 저장될 새 비밀번호 -->
<input type="password" name="new_password" class="form-control form-control-custom" placeholder="새 비밀번호" required>
                    </div>
                    <div class="form-group mb-4 position-relative">
                        <!-- [비밀번호 확인 입력] 입력 일치 여부 확인용 (서버 측 검증) -->
<input type="password" class="form-control form-control-custom" placeholder="비밀번호 확인" required>
                    </div>
                    
                    <!-- [변경 완료 버튼] 폼 제출 → DB users.password 업데이트 -->
<button type="submit" class="btn btn-custom btn-block mt-4">
                        변경 완료
                    </button>
                </form>
            </section>

            <hr class="my-4 border-light mt-5">

            <!-- [하단 링크] 취소하고 로그인 화면으로 돌아가기 -->
<footer class="text-center">
                <a class="small font-weight-bold text-gray-600 hover-primary" href="{{ url_for('login') }}" style="text-decoration: none;">
                    취소하고 로그인으로 돌아가기
                </a>
            </footer>

        </div>
    </div>

    <script src="{{ url_for('static', path='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
